version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-future_courier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-future_courier_password}
      POSTGRES_DB: ${POSTGRES_DB:-future_courier}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-future_courier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-future_courier}:${POSTGRES_PASSWORD:-future_courier_password}@postgres:5432/${POSTGRES_DB:-future_courier}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      COOKIE_NAME: ${COOKIE_NAME:-fc_token}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@futurecourier.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_DRIVER_PASSWORD: ${SEED_DRIVER_PASSWORD:-Driver@12345}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      COOKIE_NAME: ${COOKIE_NAME:-fc_token}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
